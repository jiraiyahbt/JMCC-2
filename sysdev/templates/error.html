{% extends "base.html" %}
{% block title %}{{ error.code }} · SafeGate{% endblock %}
{% block content %}
<section class="narrow-page card form-card">
  <p class="eyebrow">SafeGate</p>
  <h1>{{ error.code }} · {{ error.name }}</h1>
  <p class="lead">{{ error.description or "The requested page could not be found." }}</p>
  <a class="button button-primary" href="{{ url_for('home') }}">Return home</a>
</section>
{% endblock %}
